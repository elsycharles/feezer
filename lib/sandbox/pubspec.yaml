name: withdrawal_optimizer
description: Un utilitaire Dart pour optimiser les retraits et minimiser les frais bancaires.

version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dev_dependencies:
  test: ^1.21.0

# Configuration pour l'analyse du code
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  strong-mode:
    implicit-casts: false
    implicit-dynamic: false

linter:
  rules:
    # Style
    - always_declare_return_types
    - always_put_control_body_on_new_line
    - avoid_empty_else
    - avoid_redundant_argument_values
    - avoid_returning_null_for_void
    - avoid_unused_constructor_parameters
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - use_key_in_widget_constructors

    # Erreurs
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - hash_and_equals
    - invariant_booleans
    - literal_only_boolean_expressions
    - no_duplicate_case_values
    - valid_regexps